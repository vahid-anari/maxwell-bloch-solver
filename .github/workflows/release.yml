name: release

# Pushing a tag vX.Y.Z publishes a GitHub Release titled X.Y.Z whose text is the
# "## X.Y.Z — date" section of CHANGELOG.md. For a tag pushed before this workflow
# existed, run it by hand: Actions → release → Run workflow, with the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v10.4.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section '## $version'" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "$VERSION" --notes-file notes.md --verify-tag
