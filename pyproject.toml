[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maxwell-bloch-studio"
version = "10.5.0"
description = "Desktop app for simulating and fitting Maxwell-Bloch models of astrophysical maser light curves"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vahid Anari", email = "vahid.anari8@gmail.com" }]
keywords = [
    "maxwell-bloch", "maser", "superradiance", "astrophysics",
    "light-curve", "fitting", "pyside6", "gui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "PySide6>=6.5,<7",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "psutil>=5.9",
    "pygments>=2.0",
    "sciwidgets~=0.11.0",
    "mbsolver~=0.3.0",
]

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[project.scripts]
mbstudio = "mbstudio.cli:main"

[project.gui-scripts]
maxwell-bloch-studio = "mbstudio.main:main"

[project.urls]
Homepage = "https://github.com/vahid-anari/maxwell-bloch-studio"
Repository = "https://github.com/vahid-anari/maxwell-bloch-studio"
Issues = "https://github.com/vahid-anari/maxwell-bloch-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mbstudio.resources" = ["*.json", "*.pdf", "*.py", "icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
